      <ellipse cx="106" cy="80" rx="2" ry="1.3"/><ellipse cx="82" cy="90" rx="2.2" ry="1.4"/><ellipse cx="98" cy="94" rx="2.4" ry="1.5"/>
      <ellipse cx="88" cy="101" rx="1.8" ry="1.2"/><ellipse cx="106" cy="100" rx="2" ry="1.3"/>

  <g fill="#3b4fb8" stroke="#24317a" stroke-width="1.5"><circle cx="66" cy="62" r="5.5"/><circle cx="76" cy="66" r="5.5"/><circle cx="58" cy="68" r="5"/><circle cx="86" cy="70" r="5"/></g>

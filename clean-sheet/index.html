<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clean Sheet</title>
  <meta name="description" content="A nightly breathalyzer log and savings tracker for a Gooner getting sober." />
  <meta name="theme-color" content="#0a1430" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clean Sheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <svg class="cannon" viewBox="0 0 64 40" aria-hidden="true"><use href="#i-cannon" /></svg>
    <div class="brand">
      <div class="brand-name">Clean Sheet</div>
      <div class="brand-sub" id="hello">Matchday 1</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear" /></svg>
    </button>
  </header>

  <main id="app">
    <section id="view-tonight" class="view active" aria-label="Tonight"></section>
    <section id="view-season" class="view" aria-label="Season"></section>
    <section id="view-savings" class="view" aria-label="Savings"></section>
    <section id="view-trophies" class="view" aria-label="Trophies"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="tonight"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon" /></svg><span>Tonight</span></button>
    <button class="tab" data-view="season"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cal" /></svg><span>Season</span></button>
    <button class="tab" data-view="savings"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-coin" /></svg><span>Savings</span></button>
    <button class="tab" data-view="trophies"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cup" /></svg><span>Trophies</span></button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-cannon" viewBox="0 0 64 40">
        <path d="M6 14 L44 6 Q50 5 51 11 L52 15 Q53 21 47 22 L9 24 Q4 24 4 19 Q4 15 6 14Z" fill="currentColor" />
        <rect x="50" y="8" width="6" height="12" rx="2" fill="currentColor" />
        <circle cx="22" cy="28" r="10" fill="none" stroke="currentColor" stroke-width="3.5" />
        <circle cx="22" cy="28" r="2.5" fill="currentColor" />
        <path d="M22 18v20M12 28h20M15 21l14 14M29 21L15 35" stroke="currentColor" stroke-width="1.6" />
        <path d="M2 38h40" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M10.3 3h3.4l.5 2.4 1.7 1 2.3-.8 1.7 2.9-1.8 1.6v2l1.8 1.6-1.7 2.9-2.3-.8-1.7 1-.5 2.4h-3.4l-.5-2.4-1.7-1-2.3.8-1.7-2.9L5.9 13v-2L4.1 9.4l1.7-2.9 2.3.8 1.7-1z" /><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" /></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.9" /><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" /></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7.5" ry="3" fill="none" stroke="currentColor" stroke-width="1.9" /><path d="M4.5 7v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V7M4.5 12v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5" fill="none" stroke="currentColor" stroke-width="1.9" /></symbol>
      <symbol id="i-cup" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v3M8 20h8l-1-3H9z" /></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.6 3.3 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></symbol>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>

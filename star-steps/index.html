<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Star Steps</title>
  <meta name="description" content="A fun daily OIT (allergy immunotherapy) star chart for little kids." />
  <meta name="theme-color" content="#8fd3ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Star Steps" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="sky" aria-hidden="true">
    <span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><span class="cloud c3">☁️</span>
    <div class="farm">
      <div class="hill h1"></div><div class="hill h2"></div><div class="fence"></div>
      <span class="pal p1">🌻</span><span class="pal p2">🐔</span><span class="pal p3">🌼</span><span class="pal horse">🐎</span>
    </div>
  </div>

  <header class="topbar">
    <button class="avatar-btn" id="avatarBtn" aria-label="Say hi"><span id="avatar">🐴</span></button>
    <div class="hello">
      <div class="hello-small" id="helloSmall">Hi there!</div>
      <div class="hello-big" id="helloBig">Star Steps</div>
    </div>
    <div class="star-pill" id="starPill" aria-label="Stars"><span>⭐</span><b id="starCount">0</b></div>
  </header>

  <main id="app">
    <section id="view-today" class="view active" aria-label="Today"></section>
    <section id="view-jar" class="view" aria-label="My prize"></section>
    <section id="view-steps" class="view" aria-label="My steps"></section>
    <section id="view-grownups" class="view" aria-label="Grown-ups"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="today" aria-label="Today"><span class="tab-ico">🏡</span><span>Today</span></button>
    <button class="tab" data-view="jar" aria-label="My prize"><span class="tab-ico">🎁</span><span>Prize</span></button>
    <button class="tab" data-view="steps" aria-label="My steps"><span class="tab-ico">🐎</span><span>Steps</span></button>
    <button class="tab" data-view="grownups" aria-label="Grown-ups"><span class="tab-ico">🔒</span><span>Grown-ups</span></button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div id="confetti" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
